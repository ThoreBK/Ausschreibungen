[project]
name = "tender-research-agent"
version = "0.1.0"
description = "Lokale Demo eines Ausschreibungs-Recherche-Agenten"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-codex>=0.169.0",
    "reportlab>=5.1.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pypdf>=7.1.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
